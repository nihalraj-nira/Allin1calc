<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Average Calculator | Allin1Calc</title>
  <link rel="icon" type="image/svg+xml" href="brand-mark.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-header"></div>
  <div class="wrap">
    <a class="crumb" href="index.html">&larr; All calculators</a>
    <main class="card">
      <h2>Average Calculator</h2>
      <p class="muted">Average, sum, smallest and largest of a list of numbers.</p>
      <form id="form" novalidate>
        <div class="grid">
        <div class="field wide"><label for="f_numbers">Numbers (separated by commas or spaces)</label><input id="f_numbers" name="numbers" type="text" value="85, 72, 91, 78, 88" inputmode="text" autocomplete="off"></div>
        </div>
        <div class="btn-row">
          <button type="submit" class="primary">Calculate</button>
          <button type="reset" class="ghost">Clear</button>
        </div>
      </form>
      <div id="result" aria-live="polite"></div>
    </main>
    <footer>developed by Nihal RAJ ⚡</footer>
  </div>
  <script src="app.js"></script>
  <script>
    Calc.init({
      async run(v) {
        const d = await api("/api/average", { numbers: v.numbers });
        return {
          caption: "Average",
          headline: num(d.average, 4),
          rows: [["Count", num(d.count, 0)], ["Sum", num(d.sum, 4)], ["Smallest", num(d.min, 4)], ["Largest", num(d.max, 4)]],
          input: `${d.count} numbers`,
        };
      },
    });
  </script>
</body>
</html>
