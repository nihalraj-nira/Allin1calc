<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Countdown | Allin1Calc</title>
  <link rel="icon" type="image/svg+xml" href="brand-mark.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-header"></div>
  <div class="wrap">
    <a class="crumb" href="index.html">&larr; All calculators</a>
    <main class="card">
      <h2>Countdown</h2>
      <p class="muted">See how much time is left until an event. It updates every second.</p>
      <form id="form" novalidate>
        <div class="grid">
        <div class="field"><label for="f_date">Event date</label><input id="f_date" name="date" type="date" value="" data-default="tomorrow"></div>
        <div class="field"><label for="f_time">Event time</label><input id="f_time" name="time" type="time" value="09:00"></div>
        </div>
        <div class="btn-row">
          <button type="submit" class="primary">Calculate</button>
          <button type="reset" class="ghost">Clear</button>
        </div>
      </form>
      <div id="result" aria-live="polite"></div>
    </main>
    <footer>Built by Nihal Raj &middot; Java backend, HTML frontend</footer>
  </div>
  <script src="app.js"></script>
  <script>
    Calc.init({
      async run(v) {
        if (!v.date || !v.time) {
          throw new Error("Choose the event date and time.");
        }
        const d = await api("/api/time/countdown", { event: `${v.date}T${v.time}`, now: nowISO() });
        return {
          caption: `Time left until ${dmy(v.date)} ${v.time}`,
          headline: countdownText(d.totalSeconds),
          rows: [],
          note: "This updates every second.",
          input: `Event ${dmy(v.date)} ${v.time}`,
          live: { target: new Date(`${v.date}T${v.time}`) },
        };
      },
    });
  </script>
</body>
</html>
