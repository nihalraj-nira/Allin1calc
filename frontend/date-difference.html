<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Date Difference | Allin1Calc</title>
  <link rel="icon" type="image/svg+xml" href="brand-mark.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-header"></div>
  <div class="wrap">
    <a class="crumb" href="index.html">&larr; All calculators</a>
    <main class="card">
      <h2>Date Difference</h2>
      <p class="muted">Years, months, days and weeks between two dates.</p>
      <form id="form" novalidate>
        <div class="grid">
        <div class="field"><label for="f_start">Start date</label><input id="f_start" name="start" type="date" value=""></div>
        <div class="field"><label for="f_end">End date</label><input id="f_end" name="end" type="date" value="" data-default="today"></div>
        </div>
        <div class="btn-row">
          <button type="submit" class="primary">Calculate</button>
          <button type="reset" class="ghost">Clear</button>
        </div>
      </form>
      <div id="result" aria-live="polite"></div>
    </main>
    <footer>developed by Nihal RAJ ⚡</footer>
  </div>
  <script src="app.js"></script>
  <script>
    Calc.init({
      async run(v) {
        const d = await api("/api/date/difference", { start: v.start, end: v.end });
        return {
          caption: "Difference",
          headline: ymd(d),
          rows: [["Total days", num(d.totalDays, 0)], ["In weeks", `${plural(d.totalWeeks, "week")} and ${plural(d.remainingDays, "day")}`]],
          note: d.startAfterEnd ? "The start date is after the end date, so the dates were put in order." : "",
          input: `${dmy(v.start)} to ${dmy(v.end)}`,
        };
      },
    });
  </script>
</body>
</html>
