<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CGPA to Percentage | Allin1Calc</title>
  <link rel="icon" type="image/svg+xml" href="brand-mark.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-header"></div>
  <div class="wrap">
    <a class="crumb" href="index.html">&larr; All calculators</a>
    <main class="card">
      <h2>CGPA to Percentage</h2>
      <p class="muted">Convert your CGPA to a percentage with a multiplier you can change.</p>
      <form id="form" novalidate>
        <div class="grid">
        <div class="field"><label for="f_cgpa">CGPA</label><input id="f_cgpa" name="cgpa" type="text" value="7.5" inputmode="decimal" autocomplete="off"></div>
        <div class="field"><label for="f_multiplier">Multiplier</label><input id="f_multiplier" name="multiplier" type="text" value="9.5" inputmode="decimal" autocomplete="off"><div class="hint">Check your college&#x27;s official formula</div></div>
        </div>
        <div class="btn-row">
          <button type="submit" class="primary">Calculate</button>
          <button type="reset" class="ghost">Clear</button>
        </div>
      </form>
      <div id="result" aria-live="polite"></div>
    </main>
    <footer>Built by Nihal Raj &middot; Java backend, HTML frontend</footer>
  </div>
  <script src="app.js"></script>
  <script>
    Calc.init({
      async run(v) {
        const d = await api("/api/cgpa", { cgpa: v.cgpa, multiplier: v.multiplier || undefined });
        return {
          caption: `CGPA ${d.cgpa} x ${d.multiplier}`,
          headline: `${num(d.percentage, 2)}%`,
          rows: [],
          note: "Different institutions use different formulas, so confirm with your own college.",
          input: `CGPA ${d.cgpa}, multiplier ${d.multiplier}`,
        };
      },
    });
  </script>
</body>
</html>
