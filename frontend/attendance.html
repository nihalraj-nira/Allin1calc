<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance Calculator | Allin1Calc</title>
  <link rel="icon" type="image/svg+xml" href="brand-mark.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-header"></div>
  <div class="wrap">
    <a class="crumb" href="index.html">&larr; All calculators</a>
    <main class="card">
      <h2>Attendance Calculator</h2>
      <p class="muted">Your attendance percentage, status, and how many classes you need or can miss.</p>
      <form id="form" novalidate>
        <div class="grid">
        <div class="field"><label for="f_total">Total classes</label><input id="f_total" name="total" type="text" value="50" inputmode="numeric" autocomplete="off"></div>
        <div class="field"><label for="f_attended">Classes attended</label><input id="f_attended" name="attended" type="text" value="40" inputmode="numeric" autocomplete="off"></div>
        <div class="field"><label for="f_target">Target attendance (%)</label><input id="f_target" name="target" type="text" value="75" inputmode="decimal" autocomplete="off"><div class="hint">Between 1 and 99</div></div>
        </div>
        <div class="btn-row">
          <button type="submit" class="primary">Calculate</button>
          <button type="reset" class="ghost">Clear</button>
        </div>
      </form>
      <div id="result" aria-live="polite"></div>
    </main>
    <footer>Built by Nihal Raj &middot; Java backend, HTML frontend</footer>
  </div>
  <script src="app.js"></script>
  <script>
    const TONE = { Safe: "ok", Borderline: "warn", Shortage: "bad" };
    Calc.init({
      async run(v) {
        const d = await api("/api/attendance", { total: v.total, attended: v.attended, target: v.target || undefined, planMiss: undefined });
        const rows = [["Attended", `${v.attended} of ${v.total} classes`], ["Target", `${d.target}%`]];
        if (d.classesNeeded > 0) {
          rows.push(["To reach the target", `Attend the next ${plural(d.classesNeeded, "class")} in a row (then ${d.percentageAfterAttending}%)`]);
        } else {
          rows.push(["Safe bunks", `${plural(d.safeBunks, "class")} can still be missed`]);
        }
        const res = {
          caption: "Current attendance",
          headline: `${d.percentage}%`,
          badge: { text: d.status, tone: TONE[d.status] || "ok" },
          rows,
          input: `${v.attended} of ${v.total}, target ${d.target}%`,
        };
        return res;
      },
    });
  </script>
</body>
</html>
