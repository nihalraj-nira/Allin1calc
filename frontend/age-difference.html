<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Age Difference | Allin1Calc</title>
  <link rel="icon" type="image/svg+xml" href="brand-mark.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-header"></div>
  <div class="wrap">
    <a class="crumb" href="index.html">&larr; All calculators</a>
    <main class="card">
      <h2>Age Difference</h2>
      <p class="muted">Find out who is older and by how much.</p>
      <form id="form" novalidate>
        <div class="grid">
        <div class="field"><label for="f_dobA">Person A: date of birth</label><input id="f_dobA" name="dobA" type="date" value="" data-max="today"></div>
        <div class="field"><label for="f_dobB">Person B: date of birth</label><input id="f_dobB" name="dobB" type="date" value="" data-max="today"></div>
        </div>
        <div class="btn-row">
          <button type="submit" class="primary">Calculate</button>
          <button type="reset" class="ghost">Clear</button>
        </div>
      </form>
      <div id="result" aria-live="polite"></div>
    </main>
    <footer>developed by Nihal RAJ ⚡</footer>
  </div>
  <script src="app.js"></script>
  <script>
    Calc.init({
      async run(v) {
        const d = await api("/api/age/difference", { dobA: v.dobA, dobB: v.dobB, today: todayISO() });
        const same = d.older === "same";
        return {
          caption: "Age difference",
          headline: same ? "Same birth date" : `Person ${d.older} is older`,
          rows: same ? [] : [["By", ymd(d)], ["Total days", num(d.totalDays, 0)]],
          input: `A ${dmy(v.dobA)}, B ${dmy(v.dobB)}`,
        };
      },
    });
  </script>
</body>
</html>
