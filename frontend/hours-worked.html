<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hours Worked | Allin1Calc</title>
  <link rel="icon" type="image/svg+xml" href="brand-mark.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-header"></div>
  <div class="wrap">
    <a class="crumb" href="index.html">&larr; All calculators</a>
    <main class="card">
      <h2>Hours Worked</h2>
      <p class="muted">Total working time between a start and an end time, minus a break.</p>
      <form id="form" novalidate>
        <div class="grid">
        <div class="field"><label for="f_start">Start time</label><input id="f_start" name="start" type="time" value="09:30"></div>
        <div class="field"><label for="f_end">End time</label><input id="f_end" name="end" type="time" value="17:30"></div>
        <div class="field"><label for="f_brk">Break (HH:MM)</label><input id="f_brk" name="brk" type="text" value="01:00" inputmode="text" autocomplete="off"><div class="hint">Leave empty for no break</div></div>
        </div>
        <div class="btn-row">
          <button type="submit" class="primary">Calculate</button>
          <button type="reset" class="ghost">Clear</button>
        </div>
      </form>
      <div id="result" aria-live="polite"></div>
    </main>
    <footer>Built by Nihal Raj &middot; Java backend, HTML frontend</footer>
  </div>
  <script src="app.js"></script>
  <script>
    Calc.init({
      async run(v) {
        const brk = (v.brk || "").trim();
        const d = await api("/api/time/hours-worked", { start: v.start, end: v.end, break: brk || undefined });
        return {
          caption: "Total working time",
          headline: `${plural(d.hours, "hour")} ${plural(d.minutes, "minute")}`,
          rows: [["As decimal hours", num(d.decimalHours, 2)]],
          note: d.overnight ? "The end time is before the start time, so an overnight shift was assumed." : "",
          input: `${v.start} to ${v.end}, break ${brk || "none"}`,
        };
      },
    });
  </script>
</body>
</html>
