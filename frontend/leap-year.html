<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leap Year Checker | Allin1Calc</title>
  <link rel="icon" type="image/svg+xml" href="brand-mark.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-header"></div>
  <div class="wrap">
    <a class="crumb" href="index.html">&larr; All calculators</a>
    <main class="card">
      <h2>Leap Year Checker</h2>
      <p class="muted">Check one year, or list every leap year in a range.</p>
      <form id="form" novalidate>
        <div class="grid">
        <div class="field"><label for="f_year">Year</label><input id="f_year" name="year" type="text" value="2024" inputmode="numeric" autocomplete="off"></div>
        <div class="field"><label for="f_toYear">To year (optional, for a range)</label><input id="f_toYear" name="toYear" type="text" value="" inputmode="numeric" autocomplete="off"><div class="hint">Leave empty to check just one year</div></div>
        </div>
        <div class="btn-row">
          <button type="submit" class="primary">Calculate</button>
          <button type="reset" class="ghost">Clear</button>
        </div>
      </form>
      <div id="result" aria-live="polite"></div>
    </main>
    <footer>developed by Nihal RAJ ⚡</footer>
  </div>
  <script src="app.js"></script>
  <script>
    Calc.init({
      async run(v) {
        const from = (v.year || "").trim();
        const to = (v.toYear || "").trim();
        if (!to) {
          const d = await api("/api/leap?year=" + encodeURIComponent(from));
          return { caption: "Leap year check", headline: `${d.year} ${d.leap ? "is" : "is not"} a leap year`, rows: [], input: `Year ${d.year}` };
        }
        const d = await api(`/api/leap?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
        return {
          caption: `Leap years from ${d.from} to ${d.to}`,
          headline: plural(d.count, "leap year"),
          rows: [["Years", d.leapYears.length ? d.leapYears.join(", ") : "None"]],
          input: `${d.from} to ${d.to}`,
        };
      },
    });
  </script>
</body>
</html>
