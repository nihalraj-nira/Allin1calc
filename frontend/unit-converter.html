<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unit Converter | Allin1Calc</title>
  <link rel="icon" type="image/svg+xml" href="brand-mark.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-header"></div>
  <div class="wrap">
    <a class="crumb" href="index.html">&larr; All calculators</a>
    <main class="card">
      <h2>Unit Converter</h2>
      <p class="muted">Length, weight, temperature, speed, data size and time.</p>
      <form id="form" novalidate>
        <div class="grid">
        <div class="field"><label for="f_category">Category</label><select id="f_category" name="category"></select></div>
        <div class="field"><label for="f_value">Value</label><input id="f_value" name="value" type="text" value="1" inputmode="decimal" autocomplete="off"></div>
        <div class="field"><label for="f_from">From</label><select id="f_from" name="from"></select></div>
        <div class="field"><label for="f_to">To</label><select id="f_to" name="to"></select></div>
        <div class="field"><label for="f_decimals">Decimal places</label><select id="f_decimals" name="decimals"><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4" selected>4</option><option value="5">5</option><option value="6">6</option><option value="8">8</option></select></div>
        </div>
        <div class="btn-row">
          <button type="submit" class="primary">Calculate</button>
          <button type="reset" class="ghost">Clear</button>
          <button type="button" class="ghost" id="swapBtn">Swap units</button>
        </div>
      </form>
      <div id="result" aria-live="polite"></div>
    </main>
    <footer>Built by Nihal Raj &middot; Java backend, HTML frontend</footer>
  </div>
  <script src="app.js"></script>
  <script>
    Calc.init({
      async init(form) {
        const data = await loadUnits();
        const category = $("#f_category");
        category.innerHTML = data.categories.map((c) => `<option value="${esc(c.category)}">${esc(c.name)}</option>`).join("");
        const fill = () => {
          const cat = data.categories.find((c) => c.category === category.value);
          const options = cat.units.map((u) => `<option value="${esc(u)}">${esc(u)}</option>`).join("");
          $("#f_from").innerHTML = options;
          $("#f_to").innerHTML = options;
          $("#f_to").selectedIndex = Math.min(1, cat.units.length - 1);
        };
        category.addEventListener("change", fill);
        form.addEventListener("reset", () => setTimeout(fill, 0));
        fill();
        $("#swapBtn").addEventListener("click", () => {
          const from = $("#f_from");
          const to = $("#f_to");
          [from.value, to.value] = [to.value, from.value];
        });
      },
      async run(v) {
        const d = await api("/api/convert", { category: v.category, from: v.from, to: v.to, value: v.value });
        const decimals = Number(v.decimals);
        const rounded = Math.round(d.result * 10 ** decimals) / 10 ** decimals;
        const shown = rounded === 0 && d.result !== 0 ? d.result.toExponential(4) : num(rounded, decimals);
        return {
          caption: d.category,
          headline: `${num(d.value, 6)} ${d.from} = ${shown} ${d.to}`,
          rows: [],
          input: `${num(d.value, 6)} ${d.from} to ${d.to}`,
        };
      },
    });
  </script>
</body>
</html>
