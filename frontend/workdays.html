<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workdays Counter | Allin1Calc</title>
  <link rel="icon" type="image/svg+xml" href="brand-mark.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-header"></div>
  <div class="wrap">
    <a class="crumb" href="index.html">&larr; All calculators</a>
    <main class="card">
      <h2>Workdays Counter</h2>
      <p class="muted">Count working days (Monday to Friday) between two dates.</p>
      <form id="form" novalidate>
        <div class="grid">
        <div class="field"><label for="f_start">Start date</label><input id="f_start" name="start" type="date" value=""></div>
        <div class="field"><label for="f_end">End date</label><input id="f_end" name="end" type="date" value="" data-default="today"></div>
        </div>
        <div class="btn-row">
          <button type="submit" class="primary">Calculate</button>
          <button type="reset" class="ghost">Clear</button>
        </div>
      </form>
      <div id="result" aria-live="polite"></div>
    </main>
    <footer>Built by Nihal Raj &middot; Java backend, HTML frontend</footer>
  </div>
  <script src="app.js"></script>
  <script>
    Calc.init({
      async run(v) {
        const d = await api("/api/date/workdays", { start: v.start, end: v.end });
        return {
          caption: "Working days (Monday to Friday)",
          headline: plural(d.workdays, "working day"),
          rows: [["Weekend days", num(d.weekendDays, 0)], ["Total days (both included)", num(d.totalDays, 0)]],
          note: "Public holidays are not counted.",
          input: `${dmy(v.start)} to ${dmy(v.end)}`,
        };
      },
    });
  </script>
</body>
</html>
