<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Age Calculator | Allin1Calc</title>
  <link rel="icon" type="image/svg+xml" href="brand-mark.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-header"></div>
  <div class="wrap">
    <a class="crumb" href="index.html">&larr; All calculators</a>
    <main class="card">
      <h2>Age Calculator</h2>
      <p class="muted">Find exact age in years, months and days, plus total days and the next birthday.</p>
      <form id="form" novalidate>
        <div class="grid">
        <div class="field"><label for="f_dob">Date of birth</label><input id="f_dob" name="dob" type="date" value="" data-max="today"></div>
        <div class="field"><label for="f_onDate">Calculate age on</label><input id="f_onDate" name="onDate" type="date" value="" data-default="today"></div>
        </div>
        <div class="btn-row">
          <button type="submit" class="primary">Calculate</button>
          <button type="reset" class="ghost">Clear</button>
        </div>
      </form>
      <div id="result" aria-live="polite"></div>
    </main>
    <footer>developed by Nihal RAJ ⚡</footer>
  </div>
  <script src="app.js"></script>
  <script>
    Calc.init({
      async run(v) {
        const on = v.onDate || todayISO();
        const d = await api("/api/age", { dob: v.dob, onDate: v.onDate || undefined, today: todayISO() });
        return {
          caption: `Age on ${dmy(on)}`,
          headline: `${d.years} years, ${d.months} months, ${d.days} days`,
          rows: [
            ["Total days", num(d.totalDays, 0)],
            ["Total weeks", num(d.totalWeeks, 0)],
            ["Total hours", num(d.totalHours, 0)],
            ["Born on a", d.birthWeekday],
            ["Next birthday", `${dmy(d.nextBirthday)} (${d.daysToNextBirthday === 0 ? "today!" : "in " + plural(d.daysToNextBirthday, "day")})`],
          ],
          input: `Born ${dmy(v.dob)}, on ${dmy(on)}`,
        };
      },
    });
  </script>
</body>
</html>
